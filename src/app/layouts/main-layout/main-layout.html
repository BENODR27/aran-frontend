<div class="main-layout" [class.main-layout--sidebar-open]="sidebarOpen()">
  <app-sidebar [mobileOpen]="sidebarOpen()" (closeMenu)="closeSidebar()" />
  <div class="main-layout__backdrop" (click)="closeSidebar()"></div>
  <div class="main-layout__content">
    <app-header (menuToggle)="toggleSidebar()" />
    <main class="main-layout__main"><router-outlet /></main>
  </div>
</div>
