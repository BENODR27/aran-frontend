<section class="content-card" [class.content-card--padded]="padded()">
  <header class="content-card__header">
    <div>
      @if (title()) {
        <h2>{{ title() }}</h2>
      }
      @if (description()) {
        <p>{{ description() }}</p>
      }
    </div>
    <div class="content-card__header-actions"><ng-content select="[card-actions]" /></div>
  </header>
  <div class="content-card__body"><ng-content /></div>
</section>
