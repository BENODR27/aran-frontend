<app-page-header
  eyebrow="Overview"
  title="Good morning, Beno"
  description="Here is what is happening across your operation today."
>
  <button class="btn btn-primary" type="button">+ New activity</button>
</app-page-header>

<div class="dashboard__metrics row g-3">
  <div class="col-12 col-sm-6 col-xl-3">
    <app-content-card title="Active batches"
      ><strong class="dashboard__metric">248</strong
      ><small class="text-success">↑ 12.5% vs last month</small></app-content-card
    >
  </div>
  <div class="col-12 col-sm-6 col-xl-3">
    <app-content-card title="Completed today"
      ><strong class="dashboard__metric">86</strong
      ><small class="text-success">↑ 8.2% vs yesterday</small></app-content-card
    >
  </div>
  <div class="col-12 col-sm-6 col-xl-3">
    <app-content-card title="Needs attention"
      ><strong class="dashboard__metric">12</strong
      ><small class="text-warning">3 require action</small></app-content-card
    >
  </div>
  <div class="col-12 col-sm-6 col-xl-3">
    <app-content-card title="Traceability score"
      ><strong class="dashboard__metric">98.4%</strong
      ><small class="text-success">↑ 1.4% this quarter</small></app-content-card
    >
  </div>
</div>

<app-content-card
  title="Recent activity"
  description="The latest changes across your facilities."
  [padded]="false"
>
  <app-action-toolbar>
    <select toolbar-filters class="form-select form-select-sm" aria-label="Filter by facility">
      <option>All facilities</option>
      <option>Amman Central</option>
      <option>Irbid North</option>
    </select>
    <button toolbar-actions class="btn btn-sm btn-outline-secondary" type="button">Export</button>
  </app-action-toolbar>
  <app-data-table
    [columns]="columns"
    [rows]="activities"
    [pageSize]="4"
    [searchable]="true"
    rowLabel="activity"
  />
</app-content-card>

<div class="dashboard__bottom row g-3">
  <div class="col-12 col-lg-7">
    <app-content-card title="Operational status"
      ><div class="dashboard__statuses">
        <div>
          <app-status-badge label="Production systems" tone="success" /><span
            >All systems operational</span
          >
        </div>
        <div>
          <app-status-badge label="Data sync" tone="info" /><span
            >Last synchronized 2 minutes ago</span
          >
        </div>
        <div>
          <app-status-badge label="Notifications" tone="warning" /><span
            >3 unread notifications</span
          >
        </div>
      </div></app-content-card
    >
  </div>
  <div class="col-12 col-lg-5">
    <app-content-card title="Quick start"
      ><p class="dashboard__quick-copy">
        Use the navigation to explore the operations workspace. This dashboard uses test data and is
        ready to connect to your API.
      </p>
      <button class="btn btn-outline-primary btn-sm" type="button">
        View documentation
      </button></app-content-card
    >
  </div>
</div>
